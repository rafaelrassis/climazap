version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Next/React andam juntos; patches e minors agrupados para reduzir ruído
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react", "@types/react-dom"]
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["next", "react", "react-dom", "next-auth", "prisma", "@prisma/client"]
    ignore:
      # versões fixadas de propósito: atualizar manualmente, com testes
      - dependency-name: "next-auth"
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
